<!DOCTYPE html>

    <style>
        .page-container {
            display: flex;
            gap: 20px;
            margin: 15px 0;
        }
        .main-content {
            flex: 2;
        }
        .sidebar-wrapper {
            flex: 1;
        }

        /* 2. Container holding your videos horizontally */
        .list {
            display: flex;       /* Places items side-by-side */
            flex-wrap: wrap;     /* Allows items to wrap dynamically on zoom/resize */
            gap: 20px;           /* Adds a clean layout gap between players */
            margin-top: 15px;
        }

        /* 3. Setting the exact size framework for your advanced video players */
        .video-wrapper {
            width: 350px;        /* Dictates the base size of your player */
            max-width: 100%;     /* Keeps it safe on smaller screen windows */
        }

        /* 4. THE STRETCH FORCE: Forces the actual video element inside the player to stretch to the box */
        .video-js .vjs-tech {
            object-fit: fill !important;
        }
    </style>
</head>
<body>

    <div class="nav">

    <script src="https://vjs.zencdn.net/8.10.0/video.js"></script>

    <script>
        // Runs automatically to parse internal multiple audio tracks if present inside the files
        document.querySelectorAll('.video-js').forEach((videoEl) => {
            const player = videojs(videoEl.id);
            player.ready(function() {
                let audioTrackList = player.audioTracks();
                if(audioTrackList.length > 1) {
                    player.controlBar.audioTrackToggle.show();
                }
            });
        });
    </script>
