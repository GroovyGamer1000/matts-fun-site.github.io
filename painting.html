<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matt's Fun Site! - Paint</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .paint-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
        }

        /* Styling the MS Paint window framework */
        .paint-frame {
            width: 100%;
            max-width: 1000px;  /* Keeps the canvas at a nice desktop size */
            height: 600px;      /* Gives plenty of vertical space for the tools */
            border: 4px solid #800000; /* Matches your site accents */
            border-radius: 8px;
            box-shadow: 3px 3px 12px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div class="nav">
        <span class="navLink"><a href="index.html">Home</a></span> | 
        <span class="navLink"><a href="videos.html">Videos</a></span> | 
        <span class="navLink"><a href="games.html">Games</a></span> | 
        <span class="navLink"><a href="#">Paint</a></span>
    </div>

    <div class="header">
        <span class="title">Matt's Fun Site!</span>
    </div>

    <div class="paint-container">
        <div class="subtitle">
            <p>Retro Paint Studio</p>
        </div>

        <iframe 
            class="paint-frame" 
            src="https://jspaint.app" 
            allow="fullscreen">
        </iframe>
    </div>

    <div class="box1">
        <p>Have fun painting with all the classic tools!</p>
    </div>

    <div class="footer">
        ©2026
    </div>
